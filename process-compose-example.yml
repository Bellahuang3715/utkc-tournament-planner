# Copy to process-compose.yml (gitignored) and run: process-compose up
# Install: https://github.com/F1bonacc1/process-compose
#
# Start Postgres first: docker compose up -d postgres
version: "0.5"
log_level: debug

processes:
  frontend:
    working_dir: "client"
    command: "yarn run dev"
    availability:
      restart: "on_failure"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/"
        port: 3000
      timeout_seconds: 10
      failure_threshold: 999
      period_seconds: 10

  backend:
    working_dir: "server"
    command: "pipenv run gunicorn -k project.uvicorn.RestartableUvicornWorker project.app:app --bind localhost:8400 --workers 1 --reload"
    availability:
      restart: "on_failure"
    environment:
      - "ENVIRONMENT=DEVELOPMENT"
    readiness_probe:
      http_get:
        host: 127.0.0.1
        scheme: http
        path: "/ping"
        port: 8400
      timeout_seconds: 10
      failure_threshold: 999
      period_seconds: 10
