[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
follow_imports = "silent"
disallow_any_explicit = false
disallow_any_generics = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = false
warn_unused_configs = true
disallow_subclassing_any = false
disallow_untyped_calls = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_reexport = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["aioresponses.*"]
disallow_any_explicit = false
disallow_any_generics = false

[[tool.mypy.overrides]]
module = ["fastapi_sso.*", "firebase_admin.*", "asyncpg.*"]
ignore_missing_imports = true

[tool.pylint."MESSAGES CONTROL"]
disable = [
    "broad-except",
    "broad-exception-raised",
    "consider-iterating-dictionary",
    "contextmanager-generator-missing-cleanup",
    "dangerous-default-value",
    "duplicate-code",
    "fixme",
    "not-callable",
    "import-outside-toplevel",
    "invalid-name",
    "logging-fstring-interpolation",
    "missing-docstring",
    "no-name-in-module",
    "protected-access",
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-locals",
    "too-many-nested-blocks",
    "too-many-positional-arguments",
    "unspecified-encoding",
    "unused-argument",
    "wrong-import-position",
    "unused-import",
]

[tool.ruff]
line-length = 100
respect-gitignore = true
show-fixes = true
output-format = "full"
target-version = "py312"
exclude = [
    ".venv",
    ".mypy_cache",
    ".pytest_cache",
    "__pycache__",
    "node_modules",
    "alembic/versions",  # historical migrations — don't reformat
]

# Start with a practical gate (errors + imports + whitespace). Broader
# upstream Bracket rules (UP/TC/TD/…) can be tightened once debt is cleared.
[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "PGH",
    "PIE",
    "PLE",
    "PLW",
    "RUF100",
    "W",
]
ignore = [
    "E501",  # line length — enforce via formatter gradually
]

[tool.vulture]
min_confidence = 0
paths = ["."]
exclude = [".venv", "node_modules"]
ignore_decorators = ["@pytest.*", "@*router*", "@app.*", "@*validator*", "@cli.command*"]
ignore_names = [
    "RestartableUvicornWorker",
    "_generate_next_value_",
    "downgrade",
    "startup_and_shutdown_uvicorn_server",
    "todo*",
    "upgrade",
]
sort_by_size = true
