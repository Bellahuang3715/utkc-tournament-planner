# Auto-merge Dependabot patch/minor PRs once required checks (if any) pass.
# Repo settings required:
#   1. Settings → General → Pull Requests → Allow auto-merge
#   2. Settings → Actions → General → Workflow permissions
#        → Allow GitHub Actions to create and approve pull requests
name: Dependabot auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Approve and enable auto-merge for patch/minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          # Approve may fail if Actions isn't allowed to approve PRs; still enable auto-merge.
          gh pr review --approve "$PR_URL" || echo "Approve skipped/failed; continuing with auto-merge"
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
