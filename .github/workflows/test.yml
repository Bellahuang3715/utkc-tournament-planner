name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client-unit:
    name: Client unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test

  server-api:
    name: Server API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bracket_dev
          POSTGRES_PASSWORD: bracket_dev
          POSTGRES_DB: bracket_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bracket_dev -d bracket_dev"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run focused API tests
        run: >
          pipenv run pytest
          tests/integration_tests/api/ping_test.py
          tests/integration_tests/api/divisions_test.py
          tests/integration_tests/api/brackets_test.py
          tests/integration_tests/api/public_dashboard_test.py
          -q

  client-e2e-smoke:
    name: Client e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [client-unit]
    # Smoke against a production Next build; allow failure until Firebase/env is wired in CI.
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test:e2e:install
      - name: Build Next app
        run: yarn --ignore-engines build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Start Next and run smoke tests
        run: |
          yarn --ignore-engines start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          yarn --ignore-engines test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
