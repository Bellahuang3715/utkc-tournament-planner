name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client-unit:
    name: Client unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test

  server-lint:
    name: Server lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Ruff format + check
        run: ./check.sh

  server-api:
    name: Server API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bracket_dev
          POSTGRES_PASSWORD: bracket_dev
          # Dedicated test DB — must match server/ci.env (never bracket_dev locally).
          POSTGRES_DB: bracket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bracket_dev -d bracket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run pytest with coverage
        run: ./ci_pytest.sh -q
        env:
          ENVIRONMENT: CI
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: server/coverage.xml
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-e2e-smoke:
    name: Client e2e smoke (Playwright)
    runs-on: ubuntu-latest
    needs: [client-unit]
    # Smoke against a production Next build; allow failure until Firebase/env is wired in CI.
    continue-on-error: true
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test:e2e:install
      - name: Build Next app
        run: yarn --ignore-engines build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # Smoke does not need real Firebase; client skips init when unset.
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8400
      - name: Start Next and run smoke tests
        run: |
          yarn --ignore-engines start &
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000 >/dev/null; then
              break
            fi
            sleep 2
          done
          yarn --ignore-engines test:e2e
        env:
          E2E_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8400
