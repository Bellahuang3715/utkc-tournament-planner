name: Test

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  client-unit:
    name: Client unit (Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test:coverage
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: client/coverage/lcov.info
          flags: client
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  server-lint:
    name: Server lint (ruff)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Ruff format + check
        run: ./check.sh

  server-api:
    name: Server API (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bracket_dev
          POSTGRES_PASSWORD: bracket_dev
          # Dedicated test DB — must match server/ci.env (never bracket_dev locally).
          POSTGRES_DB: bracket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bracket_dev -d bracket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipenv
        run: pip install pipenv
      - name: Install dependencies
        run: pipenv install --dev
      - name: Run pytest with coverage
        run: ./ci_pytest.sh -q
        env:
          ENVIRONMENT: CI
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: server/coverage.xml
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  client-e2e-smoke:
    name: Client smoke and scorekeeping (Playwright)
    runs-on: ubuntu-latest
    needs: [client-unit]
    defaults:
      run:
        working-directory: client
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: bracket_dev
          POSTGRES_PASSWORD: bracket_dev
          POSTGRES_DB: bracket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bracket_dev -d bracket_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install server dependencies
        working-directory: server
        run: |
          pip install pipenv
          pipenv install --dev
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: client/yarn.lock
      - run: yarn install --frozen-lockfile --ignore-engines
      - run: yarn --ignore-engines test:e2e:install
      - name: Build Next app
        run: yarn --ignore-engines build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:8400
      - name: Start the seeded API and Next, then run Playwright
        run: |
          (cd ../server && exec pipenv run python -m tests.serve_scorekeeping_fixture) > "$RUNNER_TEMP/api.log" 2>&1 &
          api_pid=$!
          ./node_modules/.bin/next start --hostname 127.0.0.1 > "$RUNNER_TEMP/next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$api_pid" "$next_pid" 2>/dev/null || true; wait "$api_pid" "$next_pid" 2>/dev/null || true' EXIT
          for url in http://127.0.0.1:8400/ping "$E2E_BASE_URL"; do
            if ! curl --fail --silent --show-error --retry 30 --retry-delay 1 --retry-connrefused "$url" > /dev/null; then
              cat "$RUNNER_TEMP/api.log" "$RUNNER_TEMP/next.log"
              exit 1
            fi
          done
          yarn --ignore-engines test:e2e
        env:
          ENVIRONMENT: CI
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_PUBLIC_SLUG: playwright-scorekeeping
          E2E_SCOREKEEPING: "1"
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: |
            client/test-results/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/next.log
