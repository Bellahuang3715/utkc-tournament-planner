# Weekly dependency updates + monthly Actions bumps.
# Security updates are enabled separately in the repo Security settings.
version: 2
updates:
  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # Keep majors as individual PRs for review; group quieter bumps.
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-patch-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      production-patch-minor:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-patch-minor:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
